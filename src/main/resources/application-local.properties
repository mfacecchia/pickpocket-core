spring.application.name=splitnings

server.port=8000
# server.servlet.contextPath=/api

# --- OPENAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- DATABASE ---
spring.datasource.url=jdbc:mysql://localhost:3306/splitnings
spring.datasource.username=root
spring.datasource.password=randomNewPassword
spring.datasource.driver=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_audit
spring.jpa.properties.org.hibernate.envers.revision_field_name=revision_id
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revision_type
# Remove this property to enable spring envers
spring.jpa.properties.hibernate.integration.envers.enabled=false

# --- OAUTH ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/splitnings

splitnings.security.keycloak.server-url=http://localhost:8080/
splitnings.security.keycloak.realm=master
splitnings.security.keycloak.username=admin
splitnings.security.keycloak.password=admin
splitnings.security.keycloak.client-id=admin-cli

splitnings.keycloak.realm-name=splitnings

